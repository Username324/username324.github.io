<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="mystyle.css">
    <link rel="font" href="HelveticaNeueBold.otf">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

</head>

<body>
    <div>
        <header class="header">
            <nav>
                <ul class="menuitems NoSelect">
                    <li><a href="Homepage.html">Home</a></li>
                    <li><a href="ShopPage.html">Shop</a></li>
                    <li><a href="EventsPage.html">Events</a></li>
                    <li><a href="ContactPage.html">Contact</a></li>
                </ul>
            </nav>

            <div class="NoSelect contactpagetitles contactpagetext">
                <h1 class="headingshadowed h1contactpage">Get in touch with us</h1>
                <h2 class="subheadingshadowed"></h2>
            </div>
        </header>


        <form class="OffWhiteText contact-form robotoContact NoSelect">
            <h2>Contact Us</h2>

            <div class="form-row">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
            </div>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Send Message</button>
        </form>



        </main>

        <footer class="NoSelect terms footer">
            <div style="padding-left: 5%; " class="footer-content">
                <img src="eminemlogo.png" alt="Eminem Logo" class="footer-logo" draggable="false">
                <p class="footer-text">Terms and Conditions | Privacy Policy | © 2025 Eminem</p>
            </div>
        </footer>



    </div>
</body>

</html>
